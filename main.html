<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="book-library">

        <div class="book">
            <img src="https://images-na.ssl-images-amazon.com/images/I/91b0C2YNSrL.jpg" alt="Spy in the Amber">

            <p class="author">BY Manohar Malgonkar</p>

            <p class="author">by Vikram Chandra</p>
            <div class="price">Rs. 199</div>

        <div class="book">
            <img src="https://images-na.ssl-images-amazon.com/images/I/91+1SUO3vUL.jpg" alt="Byomkesh Bakshi">
